# Phase 1 services: db, app, worker. The backup service arrives in Phase 5.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bedboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: bedboard
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bedboard -d bedboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bedboard:${POSTGRES_PASSWORD:-change-me}@db:5432/bedboard
    command: sh -c "npx prisma migrate deploy && npm start"
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bedboard:${POSTGRES_PASSWORD:-change-me}@db:5432/bedboard
    command: npm run worker
    depends_on:
      app:
        condition: service_healthy

  # Nightly encrypted dump of the database into ./backups, kept 14 days (see ADMIN_GUIDE for restoring).
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: bedboard
      PGDATABASE: bedboard
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./backups:/backups
      - ./backup:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
